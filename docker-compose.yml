version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: legalsenser_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=legalSenser

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: legalsenser_ai
    restart: always
    ports:
      - "8000:7860"
    env_file:
      - ./ai/.env
    environment:
      - PORT=7860

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalsenser_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - ENVIRONMENT=development
      - MONGODB_URI=mongodb://mongodb:27017/legalSenser
      - AI_SERVICE_URL=http://ai-service:7860

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalsenser_frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

volumes:
  mongo_data:
